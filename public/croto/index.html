<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUZZER</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://open.spotify.com/track/0P1hQTyyVKHrjTVnA1BwT3">
<!-- fallback sin js: si el script no corre, el meta refresh manda a los 2s -->
<meta http-equiv="refresh" content="2; url=https://open.spotify.com/track/0P1hQTyyVKHrjTVnA1BwT3">
<style>
  html,body{height:100%}
  body{margin:0;background:#120A1C;color:#F5E9C8;display:grid;place-items:center;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;padding:24px}
  p{margin:0 0 14px;color:#C9BCA6;font-size:15px}
  a{color:#5FE3CE;font-weight:600}
</style>
</head>
<body>
  <div>
    <p>abriendo croto en spotify...</p>
    <a href="https://open.spotify.com/track/0P1hQTyyVKHrjTVnA1BwT3">si no pasa nada, entra aca</a>
  </div>
  <!-- los 700ms le dan tiempo al beacon de cloudflare web analytics
       a mandar el pageview antes de irnos. asi se puede contar
       cuanta gente pasa de verdad. -->
  <script>setTimeout(function(){location.replace("https://open.spotify.com/track/0P1hQTyyVKHrjTVnA1BwT3");},700);</script>
</body>
</html>
